[package]
name = "lrgame"
description = "Native LEGO Racers runtime using original assets and behavior references"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
lrformats = { path = "../lrformats" }
lrsim = { path = "../lrsim" }
macroquad = { version = "=0.4.14", features = ["audio"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[[bin]]
name = "lrracers"
path = "src/main.rs"
